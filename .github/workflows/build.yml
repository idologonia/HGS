name: build-windows

# Builds HGS.exe (PyInstaller), runs the smoke test on the BUILT program, packs a portable zip and
# an installer (Inno Setup). Artifacts are attached to every run; tags v* also create a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller==6.22.3
          pip install -e . --no-deps
      - name: Build with PyInstaller
        run: pyinstaller packaging/hgs.spec --noconfirm
      - name: Smoke test of the built program
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/smoke_test.py dist/HGS/HGS.exe
      - name: Version
        shell: bash
        run: echo "HGS_VERSION=$(python -c 'import hgs; print(hgs.__version__)')" >> "$GITHUB_ENV"
      - name: Portable zip
        shell: pwsh
        run: |
          Copy-Item README.md dist/HGS/
          Set-Content dist/HGS/portable.txt "Delete this file to keep data in %LOCALAPPDATA%\HGS instead of .\data"
          Compress-Archive -Path dist/HGS -DestinationPath "dist/HGS-portable-$env:HGS_VERSION.zip"
          Remove-Item dist/HGS/portable.txt
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          } else { $iscc = "iscc" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/hgs.iss
      - uses: actions/upload-artifact@v4
        with:
          name: HGS-windows
          path: |
            dist/HGS-portable-*.zip
            dist/HGS-Setup-*.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HGS-portable-*.zip
            dist/HGS-Setup-*.exe
